name: Test install.sh / install.ps1

# Runs the installers against real macOS, Linux, and Windows runners:
#   - the pure-Python unit tests (tests/*.py)
#   - the REAPER integration state matrix
#     (tests/integration/test_reaper_states.sh / .ps1), which exercises
#     install.sh --reaper-only / install.ps1 -ReaperOnly against
#     disposable fake REAPER directories covering fresh/partial/
#     pre-configured/REAPER-running/re-run starting states
#   - the full end-to-end install (tests/integration/test_install.sh /
#     .ps1): venv creation, PyTorch (importable, not just installed), the
#     midigpt[http,inference] backend (from PyPI -- no sibling MIDI-GPT
#     checkout needed here), the REAPER Scripts junction/symlink, ReaImGui,
#     reaper.ini configuration with the venv active, no unexpected [WARN]
#     lines, and the unit test suite, all against a disposable copy of the
#     repo.
#   - install.ps1's helper functions (tests/integration/
#     test_install_helpers.ps1), for the Windows failure modes these runners
#     can't reproduce: they ship with the MSVC runtime PyTorch needs, so a
#     machine without it can only be tested on a clean Windows machine.
# See those scripts' headers for exactly what each does and doesn't prove.
#
# install.ps1's rewrite (ReaPack/ReaImGui/Arachno/checksum parity with
# install.sh) was authored without a local PowerShell to test against --
# this workflow's windows-latest jobs are the first real verification it
# gets, since GitHub's windows-latest runners ship both powershell.exe
# (5.1, what Install - Windows.bat actually launches) and pwsh (7+).

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.ps1"
      - "src/Scripts/MIDI-GPT/**"
      - "tests/**"
      - ".github/workflows/test-install.yml"
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "src/Scripts/MIDI-GPT/**"
      - "tests/**"
      - ".github/workflows/test-install.yml"
  workflow_dispatch: {}

# The installers fetch ReaPack's published checksum from the GitHub API;
# authenticated, that isn't subject to the 60/hour unauthenticated limit that
# shared runner IPs can exhaust (which turned the checksum step into a
# random [WARN] and a failed run).
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  reaper-states-unix:
    name: REAPER state matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run REAPER integration state matrix
        run: ./tests/integration/test_reaper_states.sh

  reaper-states-windows:
    name: REAPER state matrix (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run REAPER integration state matrix
        shell: pwsh
        run: .\tests\integration\test_reaper_states.ps1

      # The failure modes this runner can't reproduce for real (it ships the
      # MSVC runtime, so `import torch` never fails here), tested at the
      # function level. Under powershell.exe (5.1) -- what
      # "Install - Windows.bat" actually launches.
      - name: Run install.ps1 helper unit tests
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\integration\test_install_helpers.ps1

  # Both ends of the supported Python range (3.10 to 3.14; Intel Macs stop
  # at 3.12, and these runners are Apple Silicon) plus the recommended 3.12.
  full-install-unix:
    name: Full install (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # install.sh prefers python3.12 when several are on PATH; point it
      # at the one under test.
      - name: Run full install integration test
        env:
          PYTHON_CMD: ${{ steps.python.outputs.python-path }}
        run: ./tests/integration/test_install.sh

  full-install-windows:
    name: Full install (windows-latest, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run full install integration test
        shell: pwsh
        run: .\tests\integration\test_install.ps1

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
